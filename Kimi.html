<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Physics Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #16213e;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.8;
            z-index: 10;
        }

        .info h2 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .info .stat {
            color: #a0a0a0;
        }

        .info .value {
            color: #00d4ff;
            font-weight: bold;
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="info">
            <h2>🔵 Bouncing Ball Physics</h2>
            <div>Gravity: <span class="value" id="g-val">9.8</span> <span class="stat">m/s²</span></div>
            <div>Restitution: <span class="value" id="r-val">0.85</span></div>
            <div>Velocity Y: <span class="value" id="v-val">0.00</span> <span class="stat">m/s</span></div>
            <div>Height: <span class="value" id="h-val">0.00</span> <span class="stat">m</span></div>
            <div>Bounces: <span class="value" id="b-val">0</span></div>
        </div>
        <canvas id="simCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = 800;
        canvas.height = 600;

        // Physics constants
        const GRAVITY = 9.8;           // m/s²
        const PIXELS_PER_METER = 50;    // Scale factor
        const RESTITUTION = 0.85;       // Bounciness (energy retained after bounce)
        const DT = 1/60;               // Time step (60 FPS)
        const BALL_RADIUS = 20;        // pixels
        const FLOOR_Y = canvas.height - 40;
        const CEILING_Y = 40;

        // Ball state
        let ball = {
            x: canvas.width / 2,
            y: CEILING_Y + BALL_RADIUS,
            vx: 0,
            vy: 0,
            radius: BALL_RADIUS,
            color: '#00d4ff',
            trail: [],
            bounces: 0
        };

        // Initial drop height (in meters)
        const INITIAL_HEIGHT = (FLOOR_Y - CEILING_Y - BALL_RADIUS * 2) / PIXELS_PER_METER;

        // Reset ball to top with slight random horizontal velocity
        function resetBall() {
            ball.x = canvas.width / 2 + (Math.random() - 0.5) * 200;
            ball.y = CEILING_Y + BALL_RADIUS;
            ball.vx = (Math.random() - 0.5) * 4;
            ball.vy = 0;
            ball.trail = [];
            ball.bounces = 0;
            ball.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
        }

        // Update physics
        function update() {
            // Apply gravity (convert to pixels per frame)
            ball.vy += GRAVITY * PIXELS_PER_METER * DT;

            // Update position
            ball.x += ball.vx * PIXELS_PER_METER * DT;
            ball.y += ball.vy * PIXELS_PER_METER * DT;

            // Wall collisions (left/right)
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx = -ball.vx * RESTITUTION;
            }
            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx = -ball.vx * RESTITUTION;
            }

            // Floor collision
            if (ball.y + ball.radius > FLOOR_Y) {
                ball.y = FLOOR_Y - ball.radius;
                ball.vy = -ball.vy * RESTITUTION;
                ball.bounces++;

                // Add impact particles
                createParticles(ball.x, FLOOR_Y, ball.color);

                // If velocity is very small, reset (energy dissipated)
                if (Math.abs(ball.vy) < 20) {
                    setTimeout(resetBall, 500);
                }
            }

            // Ceiling collision
            if (ball.y - ball.radius < CEILING_Y) {
                ball.y = CEILING_Y + ball.radius;
                ball.vy = -ball.vy * RESTITUTION;
            }

            // Add to trail
            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 80) {
                ball.trail.shift();
            }

            // Update UI
            updateUI();
        }

        // Particle system for impact effects
        let particles = [];

        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: -Math.random() * 6 - 2,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity on particles
                p.life -= 0.02;

                if (p.life <= 0 || p.y > FLOOR_Y) {
                    particles.splice(i, 1);
                }
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw floor
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);

            // Floor highlight
            ctx.fillStyle = '#e94560';
            ctx.fillRect(0, FLOOR_Y, canvas.width, 3);

            // Draw height markers
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '12px monospace';
            for (let h = 0; h <= INITIAL_HEIGHT; h += 1) {
                let y = FLOOR_Y - h * PIXELS_PER_METER;
                ctx.fillRect(0, y, 10, 1);
                ctx.fillText(h + 'm', 12, y + 4);
            }

            // Draw trail
            if (ball.trail.length > 1) {
                for (let i = 0; i < ball.trail.length - 1; i++) {
                    let alpha = i / ball.trail.length;
                    ctx.beginPath();
                    ctx.moveTo(ball.trail[i].x, ball.trail[i].y);
                    ctx.lineTo(ball.trail[i+1].x, ball.trail[i+1].y);
                    ctx.strokeStyle = `rgba(0, 212, 255, ${alpha * 0.5})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            // Draw particles
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Draw ball shadow
            let shadowScale = 1 - (FLOOR_Y - ball.y) / (FLOOR_Y - CEILING_Y) * 0.5;
            let shadowAlpha = 0.3 * (1 - (FLOOR_Y - ball.y) / (FLOOR_Y - CEILING_Y));
            ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
            ctx.beginPath();
            ctx.ellipse(ball.x, FLOOR_Y + 5, ball.radius * shadowScale, ball.radius * 0.3 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();

            // Draw ball
            let gradient = ctx.createRadialGradient(
                ball.x - ball.radius * 0.3, 
                ball.y - ball.radius * 0.3, 
                ball.radius * 0.1,
                ball.x, 
                ball.y, 
                ball.radius
            );
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.3, ball.color);
            gradient.addColorStop(1, ball.color.replace(')', ', 0.8)').replace('hsl', 'hsla'));

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Ball outline
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Velocity vector
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(ball.x + ball.vx * 5, ball.y + ball.vy * 5);
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Arrowhead
            let angle = Math.atan2(ball.vy, ball.vx);
            let arrowLen = 10;
            let endX = ball.x + ball.vx * 5;
            let endY = ball.y + ball.vy * 5;
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - arrowLen * Math.cos(angle - Math.PI/6), endY - arrowLen * Math.sin(angle - Math.PI/6));
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - arrowLen * Math.cos(angle + Math.PI/6), endY - arrowLen * Math.sin(angle + Math.PI/6));
            ctx.stroke();
        }

        function updateUI() {
            let height = Math.max(0, (FLOOR_Y - ball.y - ball.radius) / PIXELS_PER_METER);
            document.getElementById('v-val').textContent = (-ball.vy / PIXELS_PER_METER).toFixed(2);
            document.getElementById('h-val').textContent = height.toFixed(2);
            document.getElementById('b-val').textContent = ball.bounces;
        }

        // Main loop
        function loop() {
            update();
            updateParticles();
            draw();
            requestAnimationFrame(loop);
        }

        // Start
        resetBall();
        loop();
    </script>
</body>
</html>
