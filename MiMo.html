<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Ball — Gravity Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --bg: #0a0a0c;
    --floor: #1a1816;
    --accent: #e8a838;
    --accent-glow: #e8a83866;
    --text-primary: #d4cfc4;
    --text-muted: #4a4640;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
  }

  /* Subtle radial atmosphere */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 85%, rgba(232, 168, 56, 0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.008) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.025;
    pointer-events: none;
    z-index: 100;
  }

  canvas {
    display: block;
    position: relative;
    z-index: 1;
  }

  .info {
    position: fixed;
    top: 28px;
    left: 32px;
    z-index: 50;
    animation: fadeIn 1s ease 0.3s both;
  }

  .info h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 1.1rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .stats {
    position: fixed;
    bottom: 28px;
    right: 32px;
    text-align: right;
    z-index: 50;
    color: var(--text-muted);
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    line-height: 1.8;
    animation: fadeIn 1s ease 0.6s both;
  }

  .stats span {
    color: var(--accent);
    font-weight: 400;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="info">
  <h1>Gravity &amp; Restitution</h1>
</div>

<div class="stats">
  Velocity: <span id="vel">0.00</span> m/s<br>
  Height: <span id="ht">0.00</span> m<br>
  Bounce: <span id="bc">0</span>
</div>

<canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const velEl = document.getElementById('vel');
  const htEl = document.getElementById('ht');
  const bcEl = document.getElementById('bc');

  // --- Physics constants ---
  const GRAVITY = 1400;          // px/s²
  const RESTITUTION = 0.78;      // energy retained per bounce
  const FLOOR_FRICTION = 0.998;  // horizontal damping
  const FLOOR_Y_OFFSET = 60;    // px from bottom of canvas
  const INITIAL_VX = 120;        // horizontal drift
  const BALL_RADIUS = 18;
  const SETTLE_THRESHOLD = 8;    // px/s — below this, reset

  // --- State ---
  let ball, floorY, bounceCount, sparks, lastTime;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    floorY = canvas.height - FLOOR_Y_OFFSET;
  }

  function init() {
    resize();
    bounceCount = 0;
    sparks = [];
    ball = {
      x: canvas.width * 0.35,
      y: floorY - BALL_RADIUS - 200,
      vx: INITIAL_VX + Math.random() * 40,
      vy: 0,
      radius: BALL_RADIUS,
      trail: [],
      squash: 1,       // y-scale for squash/stretch
      squashTarget: 1,
    };
    lastTime = performance.now();
    bcEl.textContent = '0';
  }

  // --- Sparks on bounce ---
  function spawnSparks(x, y, intensity) {
    const count = Math.floor(6 + intensity * 12);
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
      const speed = 40 + Math.random() * 180 * intensity;
      sparks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 30 * intensity,
        life: 1,
        decay: 1.5 + Math.random() * 1.5,
        size: 1 + Math.random() * 2.5 * intensity,
      });
    }
  }

  // --- Shadow particles (dust) ---
  function spawnDust(x, y) {
    for (let i = 0; i < 4; i++) {
      sparks.push({
        x: x + (Math.random() - 0.5) * 30,
        y: y,
        vx: (Math.random() - 0.5) * 20,
        vy: -5 - Math.random() * 10,
        life: 1,
        decay: 0.8 + Math.random(),
        size: 3 + Math.random() * 4,
        isDust: true,
      });
    }
  }

  // --- Main loop ---
  function loop(now) {
    requestAnimationFrame(loop);

    const dt = Math.min((now - lastTime) / 1000, 0.05); // cap delta
    lastTime = now;

    update(dt);
    draw();
  }

  function update(dt) {
    const b = ball;

    // Gravity
    b.vy += GRAVITY * dt;

    // Position
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vx *= FLOOR_FRICTION;

    // Squash/stretch interpolation
    b.squash += (b.squashTarget - b.squash) * Math.min(1, dt * 14);
    if (Math.abs(b.squash - b.squashTarget) < 0.01) {
      b.squashTarget = 1;
    }

    // Trail
    b.trail.push({ x: b.x, y: b.y, alpha: 0.35 });
    if (b.trail.length > 18) b.trail.shift();
    for (const t of b.trail) t.alpha *= 0.92;

    // Floor collision
    const floorContact = floorY - b.radius;
    if (b.y >= floorContact) {
      b.y = floorContact;

      const speed = Math.abs(b.vy);

      if (speed > SETTLE_THRESHOLD) {
        // Squash effect
        const intensity = Math.min(speed / 600, 1);
        b.squashTarget = 1 - 0.35 * intensity;
        b.squash = 1 + 0.2 * intensity; // stretch first, then squash

        b.vy = -b.vy * RESTITUTION;
        bounceCount++;
        bcEl.textContent = bounceCount;

        spawnSparks(b.x, floorY, intensity);
        spawnDust(b.x, floorY);
      } else {
        // Settled — reset
        b.vy = 0;
        b.y = floorContact;
        setTimeout(init, 1800);
        return;
      }
    }

    // Wall bounce
    if (b.x - b.radius < 0) {
      b.x = b.radius;
      b.vx = Math.abs(b.vx) * 0.85;
    } else if (b.x + b.radius > canvas.width) {
      b.x = canvas.width - b.radius;
      b.vx = -Math.abs(b.vx) * 0.85;
    }

    // Update sparks
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (!s.isDust) s.vy += GRAVITY * 0.6 * dt;
      s.life -= s.decay * dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }

    // Stats
    const totalV = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    velEl.textContent = (totalV / 100).toFixed(2);
    const height = Math.max(0, (floorY - b.radius - b.y) / 100);
    htEl.textContent = height.toFixed(2);
  }

  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // --- Floor line ---
    const floorGrad = ctx.createLinearGradient(0, floorY, 0, floorY + 40);
    floorGrad.addColorStop(0, 'rgba(232, 168, 56, 0.06)');
    floorGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, floorY, w, 40);

    ctx.strokeStyle = 'rgba(232, 168, 56, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, floorY);
    ctx.lineTo(w, floorY);
    ctx.stroke();

    // --- Floor grid lines (perspective hint) ---
    ctx.strokeStyle = 'rgba(232, 168, 56, 0.025)';
    ctx.lineWidth = 0.5;
    for (let i = 1; i <= 5; i++) {
      const yy = floorY + i * 15;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(w, yy);
      ctx.stroke();
    }

    // --- Spacing markers on floor ---
    ctx.strokeStyle = 'rgba(232, 168, 56, 0.04)';
    for (let x = 80; x < w; x += 80) {
      ctx.beginPath();
      ctx.moveTo(x, floorY - 3);
      ctx.lineTo(x, floorY + 6);
      ctx.stroke();
    }

    // --- Trail ---
    const b = ball;
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const progress = i / b.trail.length;
      const r = b.radius * progress * 0.6;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232, 168, 56, ${t.alpha * progress * 0.3})`;
      ctx.fill();
    }

    // --- Shadow on floor ---
    const shadowDist = floorY - b.y;
    const shadowScale = Math.max(0.2, 1 - shadowDist / (h * 0.7));
    const shadowAlpha = 0.12 * shadowScale;
    ctx.save();
    ctx.translate(b.x, floorY);
    ctx.scale(1 + (1 - shadowScale) * 0.8, 0.2);
    ctx.beginPath();
    ctx.arc(0, 0, b.radius * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(232, 168, 56, ${shadowAlpha})`;
    ctx.fill();
    ctx.restore();

    // --- Ball glow ---
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(1 / b.squash, b.squash); // squash/stretch

    // Outer glow
    const glowGrad = ctx.createRadialGradient(0, 0, b.radius * 0.3, 0, 0, b.radius * 3.5);
    glowGrad.addColorStop(0, 'rgba(232, 168, 56, 0.15)');
    glowGrad.addColorStop(0.5, 'rgba(232, 168, 56, 0.04)');
    glowGrad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(0, 0, b.radius * 3.5, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // Ball body
    const ballGrad = ctx.createRadialGradient(-b.radius * 0.3, -b.radius * 0.3, b.radius * 0.1, 0, 0, b.radius);
    ballGrad.addColorStop(0, '#f5d87a');
    ballGrad.addColorStop(0.4, '#e8a838');
    ballGrad.addColorStop(0.85, '#b87420');
    ballGrad.addColorStop(1, '#8a5518');
    ctx.beginPath();
    ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = ballGrad;
    ctx.fill();

    // Highlight
    const hlGrad = ctx.createRadialGradient(-b.radius * 0.35, -b.radius * 0.35, 0, -b.radius * 0.2, -b.radius * 0.2, b.radius * 0.6);
    hlGrad.addColorStop(0, 'rgba(255, 240, 200, 0.45)');
    hlGrad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = hlGrad;
    ctx.fill();

    ctx.restore();

    // --- Sparks ---
    for (const s of sparks) {
      if (s.isDust) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180, 150, 100, ${s.life * 0.15})`;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 200, 80, ${s.life * 0.8})`;
        ctx.fill();
      }
    }

    // --- Height indicator line ---
    if (floorY - b.y - b.radius > 5) {
      ctx.save();
      ctx.setLineDash([2, 4]);
      ctx.strokeStyle = 'rgba(232, 168, 56, 0.07)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y + b.radius);
      ctx.lineTo(b.x, floorY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  // --- Kick off ---
  window.addEventListener('resize', resize);
  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
